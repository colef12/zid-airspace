<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZID Airspace — Indianapolis ARTCC Sectors</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 8 14 4l14 6-2 16-12 3-10-8z' fill='%237c4dff'/></svg>">
<style>
  :root{
    --bg:#18181b; --panel:#1f1f23; --panel2:#26262b; --line:#33333a; --text:#e4e4e7; --muted:#8b8b94;
    --a1:#8b5cf6; --a2:#f59e0b; --a3:#10b981; --a4:#ef4444; --a5:#3b82f6; --a6:#ec4899; --a7:#a3e635;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  header{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(24,24,27,.92);backdrop-filter:blur(6px);z-index:5}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  header h1 span{color:var(--muted);font-weight:500}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
  .seg button{background:none;border:0;color:var(--muted);font:600 12px/1 inherit;padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .seg button small{display:block;font-weight:500;font-size:10px;margin-top:3px;opacity:.75}
  .seg button.on{background:#3f3f46;color:#fff}
  .seg button:hover:not(.on){color:var(--text)}
  #altBox{display:none;align-items:center;gap:10px}
  #altBox.on{display:flex}
  #alt{width:180px;accent-color:#a78bfa}
  #altVal{font:700 13px ui-monospace,Menlo,monospace;min-width:52px}
  .spacer{flex:1}
  .tog{display:flex;gap:12px;color:var(--muted);font-size:12px}
  .tog label{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
  #map{position:absolute;top:56px;left:0;right:340px;bottom:0;cursor:grab;touch-action:none}
  #map.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block}
  .sec{stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .12s}
  .aol{fill:none;stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
  .bnd{fill:none;stroke:#52525b;stroke-width:1.5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}
  .nb{stroke:none;cursor:pointer;fill:#a1a1aa;transition:fill-opacity .12s}
  .nbs{fill:none;stroke:#a1a1aa;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.85}
  .nbl{font:700 11px ui-sans-serif,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:#a1a1aa;paint-order:stroke;stroke:#18181b;stroke-width:3px;stroke-linejoin:round}
  .nbl .sub{font-size:9.5px;font-weight:500;fill:#8b8b94}
  .pr{fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.9}
  .prh{fill:none;stroke:transparent;stroke-width:9;vector-effect:non-scaling-stroke;cursor:pointer}
  .pr.SID{stroke:#fb923c} .pr.STAR{stroke:#22d3ee}
  .pr.dim{opacity:.18} .pr.hi{stroke-width:3;opacity:1}
  .fx{font:600 9.5px ui-monospace,Menlo,monospace;fill:#d4d4d8;paint-order:stroke;stroke:#18181b;stroke-width:3px}
  .pn{font:700 10.5px ui-monospace,Menlo,monospace;paint-order:stroke;stroke:#18181b;stroke-width:3px}
  .pn.SID{fill:#fb923c} .pn.STAR{fill:#22d3ee}
  .apt circle{cursor:pointer}
  #procBox{display:none;gap:6px;align-items:center}
  #procBox.on{display:flex}
  #procBox select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:12px inherit}
  .trc{fill:none;stroke:#a1a1aa;stroke-width:1.25;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.85}
  .lbl{font:700 12px ui-sans-serif,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:#18181b;stroke-width:3px;stroke-linejoin:round}
  .lbl .sub{font-size:10px;font-weight:600;opacity:.85}
  .apt circle{fill:#d4d4d8}
  .apt text{font:600 10px ui-monospace,Menlo,monospace;fill:#a1a1aa;paint-order:stroke;stroke:#18181b;stroke-width:3px}
  .trl{font:600 9px ui-monospace,Menlo,monospace;fill:#a1a1aa;opacity:.85;text-anchor:middle;paint-order:stroke;stroke:#18181b;stroke-width:3px}
  #tip{position:absolute;pointer-events:none;background:#18181b;border:1.5px solid;border-radius:8px;padding:6px 10px;display:none;z-index:9;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #tip b{display:block;font-size:14px;color:#fff}
  #tip span{font:12px ui-monospace,Menlo,monospace}
  #tip i{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:2px}
  aside{position:absolute;top:56px;right:0;bottom:0;width:340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:4}
  .legend{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;user-select:none}
  .chip i{width:10px;height:10px;border-radius:3px;flex:none}
  .chip.dim{opacity:.35}
  .chip.all{grid-column:span 1;justify-content:center;color:var(--muted)}
  #detail{padding:14px;border-bottom:1px solid var(--line);display:none}
  #detail.on{display:block}
  #detail h2{margin:0 0 2px;font-size:18px}
  #detail .st{font-size:12px;color:var(--muted);margin-bottom:10px}
  #detail table{width:100%;border-collapse:collapse;font-size:12px}
  #detail td{padding:4px 0;border-bottom:1px solid #2a2a30;vertical-align:top}
  #detail td:first-child{color:var(--muted);width:105px}
  #detail td.m{font-family:ui-monospace,Menlo,monospace}
  .note{margin-top:10px;font-size:11px;color:#fbbf24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:6px;padding:6px 8px}
  .x{float:right;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
  #search{margin:10px 14px 6px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
  #list{overflow:auto;flex:1;padding:0 6px 12px}
  .grp{margin-top:8px}
  .grp h3{margin:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .grp h3 i{width:8px;height:8px;border-radius:2px}
  .row{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
  .row:hover,.row.sel{background:var(--panel2)}
  .row b{font-size:12px}
  .row .n{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .f{font:12px ui-monospace,Menlo,monospace}
  .row .alt{grid-column:2/4;font-size:10.5px;color:var(--muted);margin-top:-4px}
  footer{position:absolute;left:12px;bottom:10px;font-size:10.5px;color:#71717a;z-index:3;max-width:calc(100% - 380px)}
  .zoom{position:absolute;left:12px;top:68px;display:flex;flex-direction:column;gap:4px;z-index:3}
  .zoom button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px;cursor:pointer}
  @media (max-width:900px){
    header{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px}
    header h1 span,.tog{display:none}
    #map{top:96px;right:0;bottom:42vh}
    aside{top:auto;height:42vh;width:100%;border-left:0;border-top:1px solid var(--line)}
    footer{display:none}
    .zoom{top:106px}
  }
</style>
</head>
<body>
<header>
  <h1>ZID <span>· Indianapolis ARTCC</span></h1>
  <div class="seg" id="modes">
    <button data-m="LO">LOW<small>≤ FL230</small></button>
    <button data-m="HI">HIGH<small>FL240+</small></button>
    <button data-m="IM">IM<small>Intermediate</small></button>
    <button data-m="SH">SUPER HI<small>FL340+</small></button>
    <button data-m="ALT">BY ALT<small>Owner at FL</small></button>
  </div>
  <div id="altBox"><input type="range" id="alt" min="100" max="450" step="10" value="330"><span id="altVal">FL330</span></div>
  <div id="procBox"><select id="pApt"></select><select id="pName"></select></div>
  <div class="spacer"></div>
  <div class="tog">
    <label><input type="checkbox" id="tSid"> <span style="color:#fb923c">SIDs</span></label>
    <label><input type="checkbox" id="tStar"> <span style="color:#22d3ee">STARs</span></label>
    <label><input type="checkbox" id="tApt" checked> Airports</label>
    <label><input type="checkbox" id="tNb" checked> Neighbors</label>
    <label><input type="checkbox" id="tTrc" checked> TRACONs</label>
    <label><input type="checkbox" id="tLbl" checked> Labels</label>
  </div>
</header>

<div id="map"><svg id="svg">
  <g id="world"><g id="gNb"></g><g id="gBnd"></g><g id="gSec"></g><g id="gAol"></g><g id="gTrc"></g><g id="gPr"></g></g>
  <g id="gApt" class="apt"></g><g id="gLbl"></g><g id="gFx"></g>
</svg></div>
<div class="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit">⤢</button></div>
<div id="tip"></div>

<aside>
  <div class="legend" id="legend"></div>
  <div id="detail"></div>
  <input id="search" placeholder="Search sector, ID, number, freq…">
  <div id="list"></div>
</aside>
<footer id="foot"></footer>

<script src="data.js?v=15f04770"></script>
<script>
(() => {
const D = window.ZID, SECS = D.sectors;
const AREA_COL = {1:'#8b5cf6',2:'#f59e0b',3:'#10b981',4:'#ef4444',5:'#3b82f6',6:'#ec4899',7:'#a3e635'};
const STRAT_NAME = {LO:'Low',HI:'High',IM:'Intermediate',SH:'Super High'};
const APTS = [['IND',39.717,-86.294],['SDF',38.174,-85.736],['CVG',39.049,-84.668],['CMH',39.998,-82.892],['DAY',39.902,-84.219],
  ['LEX',38.037,-84.606],['EVV',38.037,-87.532],['CRW',38.373,-81.593],['HTS',38.367,-82.558],['PKB',39.345,-81.439],
  ['HUF',39.452,-87.308],['BWG',36.964,-86.420],['TRI',36.475,-82.408],['CKB',39.296,-80.228],['LCK',39.814,-82.928],['FFO',39.826,-84.048]];

// ---------- projection
const LAT0 = 38.6, CX = Math.cos(LAT0*Math.PI/180), S = 100;
const P = ([lon,lat]) => [lon*CX*S, -lat*S];
const pathOf = rings => rings.map(r => 'M'+r.map(c => P(c).map(v=>v.toFixed(2)).join(',')).join('L')+'Z').join('');
const lineOf = l => 'M'+l.map(c => P(c).map(v=>v.toFixed(2)).join(',')).join('L');

const $ = s => document.querySelector(s), svg = $('#svg'), world = $('#world');
const NS = 'http://www.w3.org/2000/svg';
const el = (t,a={},p) => { const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; };

// ---------- state
const st = { mode:'LO', fl:330, area:null, sel:null, q:'', k:1, tx:0, ty:0 };
const hm = location.hash.slice(1).split('/');
if (['LO','HI','IM','SH','ALT'].includes((hm[0]||'').toUpperCase())) st.mode = hm[0].toUpperCase();
if (hm[1] && +hm[1]) st.fl = +hm[1];

// boundary + tracons (static)
D.boundary.forEach(r => el('path',{d:pathOf([r]),class:'bnd'},$('#gBnd')));
D.tracons.forEach(t => {
  el('path',{d:pathOf(t.rings),class:'trc'},$('#gTrc'));
});

// ---------- visible sectors (grouped when sharing a footprint)
function visible(){
  let secs = st.mode==='ALT' ? SECS.filter(s => s.floor<=st.fl && st.fl<=s.ceil) : SECS.filter(s => s.strat===st.mode);
  const groups = new Map();
  secs.forEach(s => { const k = s.derived ? 'd'+s.derivedFrom.join('-')+(s.part||'') : 'n'+s.num;
    if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(s); });
  return [...groups.values()];
}
const altKey = () => SECS.filter(s => s.floor<=st.fl && st.fl<=s.ceil).map(s=>s.num).sort((a,b)=>a-b).join(',');
const fmtAlt = s => s.floor===0 ? `FL${s.ceil} & below` : s.ceil>=999 ? `FL${s.floor} & above` : `FL${s.floor}–FL${s.ceil}`;
const tag = s => `${s.id} ${s.num}`;

// ---------- render map
let groups = [], nbs = [];
const MAJOR = new Set(['KIND','KSDF','KCVG','KCMH','KDAY','KLEX','KEVV','KCRW','KHTS','KPKB','KHUF','KBWG','KTRI','KCKB','KLCK','KFFO','KLUK','KOSU','KMQJ','KTYQ','KUMP','KLOU','KLOZ','KCMI','KILN','KBMG','KTYS']);
const NBFL = {LO:180,HI:280,IM:320,SH:380};
const nbVisible = () => { const fl = st.mode==='ALT' ? st.fl : NBFL[st.mode]; return (D.neighbors||[]).filter(n=>n.floor<=fl && fl<=n.ceil); };
const nbTag = n => `${n.fac} ${n.num}`;
const fmtNbAlt = n => n.floor<240 && n.ceil<999 && n.floor>0 ? `FL${String(n.floor).padStart(3,'0')}–FL${n.ceil}` : n.floor===0 ? `SFC–FL${n.ceil}` : n.ceil>=999 ? `FL${n.floor} & above` : `FL${n.floor}–FL${n.ceil}`;
function nbHover(n,e,p){ if(drag&&moved) return; p.setAttribute('fill-opacity',.22);
  tip.style.borderColor='#a1a1aa'; tip.innerHTML=`<b>${nbTag(n)}</b><span style="color:#d4d4d8">${n.vhf}</span><i>${n.name} · ${fmtNbAlt(n)}</i>`;
  tip.style.display='block'; moveTip(e); }
function render(){
  const gS=$('#gSec'), gA=$('#gAol'); gS.innerHTML=''; gA.innerHTML='';
  groups = visible();
  groups.forEach((g,i) => {
    const s=g[0], c=AREA_COL[s.area];
    const p = el('path',{d:pathOf(s.poly),class:'sec',fill:c,stroke:c,'stroke-opacity':.55,'data-i':i},gS);
    p.addEventListener('pointerenter',e=>hover(g,e)); p.addEventListener('pointermove',moveTip);
    p.addEventListener('pointerleave',()=>{tip.style.display='none'; paint();});
    p.addEventListener('click',e=>{ if(!moved) select(g.length>1&&st.sel&&g.includes(st.sel)?g[(g.indexOf(st.sel)+1)%g.length]:g[0]); });
  });
  const gN=$('#gNb'); gN.innerHTML=''; nbs = $('#tNb').checked ? nbVisible() : [];
  nbs.forEach((n,i)=>{ n.stubs.forEach(l=>el('path',{d:lineOf(l),class:'nbs'},gN));
    const p=el('path',{d:pathOf(n.band),class:'nb','fill-opacity':0,'data-n':i},gN);
    p.addEventListener('pointerenter',e=>nbHover(n,e,p)); p.addEventListener('pointermove',moveTip);
    p.addEventListener('pointerleave',()=>{tip.style.display='none'; p.setAttribute('fill-opacity', st.sel===n?.25:0);});
    p.addEventListener('click',()=>{ if(!moved) select(n); }); });
  const ol = st.mode==='ALT' ? D.altOutlines[altKey()] : D.outlines[st.mode];
  for (const a in ol) el('path',{d:pathOf(ol[a]),class:'aol',stroke:AREA_COL[a],'data-a':a},gA);
  paint(); labels(); list();
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.mode));
  $('#altBox').classList.toggle('on',st.mode==='ALT');
  $('#alt').value=st.fl; $('#altVal').textContent='FL'+String(st.fl).padStart(3,'0');
  history.replaceState(null,'','#'+st.mode.toLowerCase()+(st.mode==='ALT'?'/'+st.fl:''));
}
let hov=null;
function paint(){
  document.querySelectorAll('#gSec path').forEach(p=>{
    const g=groups[p.dataset.i], a=g[0].area, isSel=st.sel&&g.includes(st.sel), isH=hov===g;
    const dim = st.area && st.area!==a;
    p.setAttribute('fill-opacity', isSel?.55 : isH?.42 : dim?.06 : .22);
    p.setAttribute('stroke-opacity', dim?.15:.55);
    p.style.strokeWidth = isSel?2.5:1;
    if(isSel) p.parentNode.appendChild(p);
  });
  document.querySelectorAll('#gNb path.nb').forEach(p=>{ const n=nbs[p.dataset.n]; p.setAttribute('fill-opacity', st.sel===n?.25:0); });
  document.querySelectorAll('#gAol path').forEach(p=>p.setAttribute('stroke-opacity', st.area && st.area!=p.dataset.a ? .15 : 1));
}

// ---------- SID / STAR overlay
const PROCS = D.procs||[], PROC_APTS = [...new Set(PROCS.flatMap(p=>p.apts||[p.apt]))].sort();
const procOn = () => $('#tSid').checked || $('#tStar').checked;
function procVisible(){
  const a=$('#pApt').value, n=$('#pName').value;
  return PROCS.filter(p=>(p.kind==='SID'?$('#tSid').checked:$('#tStar').checked) && (!a||(p.apts||[p.apt]).includes(a)) && (!n||p.kind+'|'+p.name===n));
}
function procUI(){
  $('#procBox').classList.toggle('on',procOn());
  const a=$('#pApt').value, cur=$('#pName').value;
  const list=PROCS.filter(p=>(p.kind==='SID'?$('#tSid').checked:$('#tStar').checked)&&(!a||(p.apts||[p.apt]).includes(a)));
  $('#pName').innerHTML='<option value="">All procedures</option>'+list.map(p=>`<option value="${p.kind}|${p.name}">${p.name} (${p.kind}${a?'':' '+p.apt.replace(/\bK(?=[A-Z]{3}\b)/g,'')})</option>`).join('');
  if([...$('#pName').options].some(o=>o.value===cur)) $('#pName').value=cur;
}
$('#pApt').innerHTML='<option value="">All airports</option>'+PROC_APTS.map(a=>`<option>${a}</option>`).join('');
let prVis=[], prHov=null;
function renderProcs(){
  const g=$('#gPr'); g.innerHTML=''; prVis = procOn()? procVisible() : [];
  prVis.forEach((p,i)=>{ const d=p.lines.map(l=>lineOf(l)).join('');
    el('path',{d,class:'pr '+p.kind,'data-p':i},g);
    const h=el('path',{d,class:'prh'},g);
    h.addEventListener('pointerenter',e=>{ prHov=p; paintProcs(); tip.style.borderColor=p.kind==='SID'?'#fb923c':'#22d3ee';
      tip.innerHTML=`<b>${p.name}</b><span style="color:${p.kind==='SID'?'#fb923c':'#22d3ee'}">${p.kind==='SID'?'Departure':'Arrival'} · ${p.apt}</span><i>${p.lines.length} transition${p.lines.length>1?'s':''} · ${Object.keys(p.fixes).length} fixes</i>`;
      tip.style.display='block'; moveTip(e); });
    h.addEventListener('pointermove',moveTip);
    h.addEventListener('pointerleave',()=>{ prHov=null; paintProcs(); tip.style.display='none'; });
    h.addEventListener('click',()=>{ if(moved) return; $('#pApt').value=''; procUI(); $('#pName').value=p.kind+'|'+p.name; renderProcs(); labels(); });
  });
  paintProcs();
}
function paintProcs(){ document.querySelectorAll('#gPr path.pr').forEach(e=>{ const p=prVis[e.dataset.p]; e.classList.toggle('hi',prHov===p); e.classList.toggle('dim',!!prHov&&prHov!==p); }); }
function procLabels(){
  const g=$('#gFx'); g.innerHTML=''; if(!prVis.length) return;
  const zoomRel = st.k/(st.k0||st.k), single = prVis.length===1;
  if(single || zoomRel>2.2){ const seen=new Set();
    prVis.forEach(p=>{ for(const n in p.fixes){ if(seen.has(n)) continue; seen.add(n); const [x,y]=scr(P(p.fixes[n]));
      el('path',{d:`M${x},${y-3.5}L${x+3},${y+2}L${x-3},${y+2}Z`,fill:'#a1a1aa'},g); if(single||zoomRel>3.2) el('text',{x:x+5,y:y+3,class:'fx'},g).textContent=n; } }); }
  prVis.forEach(p=>{ const l=p.lines[0], c = p.kind==='STAR' ? l[0] : l[l.length-1]; const [x,y]=scr(P(c));
    el('text',{x:x+6,y:y-6,class:'pn '+p.kind},g).textContent=p.name; });
}
['#tSid','#tStar'].forEach(i=>$(i).onchange=()=>{ procUI(); renderProcs(); labels(); });
$('#pApt').onchange=()=>{ procUI(); $('#pName').value=''; renderProcs(); labels(); };
$('#pName').onchange=()=>{ renderProcs(); labels(); };

// ---------- labels & airports (screen space so they don't scale)
function labels(){
  const gL=$('#gLbl'), gP=$('#gApt'); gL.innerHTML=''; gP.innerHTML='';
  if ($('#tLbl').checked) nbs.forEach(n=>{
    const [x,y]=scr(P(n.label)); const t=el('text',{x,y:y-6,class:'nbl'},gL);
    el('tspan',{x},t).textContent=nbTag(n); if(st.k>0.9){ el('tspan',{x,dy:12,class:'sub'},t).textContent=n.name; }
  });
  if ($('#tLbl').checked) groups.forEach(g=>{
    const s=g[0], [x,y]=scr(P(s.label)), c=AREA_COL[s.area];
    const t=el('text',{x,y:y-(g.length-1)*7,class:'lbl',fill:c,opacity:st.area&&st.area!==s.area?.25:1},gL);
    g.forEach((s2,j)=>{ const ts=el('tspan',{x,dy:j?14:0},t); ts.textContent=tag(s2); });
    if (st.mode==='ALT' && st.k>1.3){ const ts=el('tspan',{x,dy:13,class:'sub'},t); ts.textContent=s.strat; }
  });
  if ($('#tApt').checked){ const zr=st.k/(st.k0||st.k);
    (D.airports||[]).forEach(a=>{ const major=MAJOR.has(a.id), [x,y]=scr(P(a.pos));
      const c=el('circle',{cx:x,cy:y,r:major?2.6:1.8,opacity:major?1:.75},gP);
      c.addEventListener('pointerenter',e=>{ tip.style.borderColor='#d4d4d8'; tip.innerHTML=`<b>${a.id}</b><span style="color:#d4d4d8">${a.name||''}</span><i>Elev ${a.elev} ft</i>`; tip.style.display='block'; moveTip(e); });
      c.addEventListener('pointermove',moveTip); c.addEventListener('pointerleave',()=>tip.style.display='none');
      if(major||zr>1.8) el('text',{x:x+5,y:y-4},gP).textContent=a.id.replace(/^K(?=[A-Z]{3}$)/,''); }); }
  procLabels();
}

// ---------- pan / zoom
const box = () => svg.getBoundingClientRect();
const scr = ([x,y]) => [x*st.k+st.tx, y*st.k+st.ty];
function apply(){ world.setAttribute('transform',`translate(${st.tx},${st.ty}) scale(${st.k})`); labels(); }
function fit(){
  const nbPad = $("#tNb").checked ? 0.5 : 0, bb = D.boundary.flat();
  const lons=bb.map(c=>c[0]), lats=bb.map(c=>c[1]);
  const pts=[[Math.min(...lons)-nbPad,Math.min(...lats)-nbPad*.6],[Math.max(...lons)+nbPad,Math.max(...lats)+nbPad*.6]].map(P), xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const b=box(), w=Math.max(...xs)-Math.min(...xs), h=Math.max(...ys)-Math.min(...ys), pad=40;
  st.k = Math.min((b.width-2*pad)/w,(b.height-2*pad)/h);
  st.k0 = st.k; st.tx = (b.width - w*st.k)/2 - Math.min(...xs)*st.k; st.ty=(b.height-h*st.k)/2 - Math.min(...ys)*st.k; apply();
}
function zoomAt(f,cx,cy){ const k=Math.max(.3,Math.min(40,st.k*f)); f=k/st.k; st.tx=cx-(cx-st.tx)*f; st.ty=cy-(cy-st.ty)*f; st.k=k; apply(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const b=box(); zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-b.left,e.clientY-b.top);},{passive:false});
let drag=null, moved=false; const pts=new Map();
svg.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,[e.clientX,e.clientY]); drag={x:e.clientX,y:e.clientY,tx:st.tx,ty:st.ty,d:pinch()}; moved=false; });
function pinch(){ if(pts.size<2) return 0; const [a,b]=[...pts.values()]; return Math.hypot(a[0]-b[0],a[1]-b[1]); }
window.addEventListener('pointermove',e=>{
  if(!drag) return; if(pts.has(e.pointerId)) pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){ const d=pinch(), [a,b]=[...pts.values()], bb=box(); if(drag.d) zoomAt(d/drag.d,(a[0]+b[0])/2-bb.left,(a[1]+b[1])/2-bb.top); drag.d=d; moved=true; return; }
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3){ moved=true; $('#map').classList.add('drag'); tip.style.display='none'; }
  if(moved){ st.tx=drag.tx+dx; st.ty=drag.ty+dy; apply(); }
});
window.addEventListener('pointerup',e=>{ pts.delete(e.pointerId); if(!pts.size){ drag=null; $('#map').classList.remove('drag'); setTimeout(()=>moved=false,0);} });
svg.addEventListener('click',e=>{ if(!moved && e.target===svg){ st.sel=null; detail(); paint(); list(); } });
$('#zin').onclick=()=>{const b=box(); zoomAt(1.4,b.width/2,b.height/2)}; $('#zout').onclick=()=>{const b=box(); zoomAt(1/1.4,b.width/2,b.height/2)}; $('#zfit').onclick=fit;
window.addEventListener('resize',fit);

// ---------- tooltip
const tip=$('#tip');
function hover(g,e){ if(drag&&moved) return; hov=g; paint(); const c=AREA_COL[g[0].area];
  tip.style.borderColor=c; tip.innerHTML=g.map(s=>`<b>${tag(s)}</b><span style="color:${c}">${s.vhf}</span>`).join('<div style="height:4px"></div>')+`<i>Area ${g[0].area} · ${g.length>1?fmtAlt(g[0]):fmtAlt(g[0])}</i>`;
  tip.style.display='block'; moveTip(e); }
function moveTip(e){ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; }
svg.addEventListener('pointerleave',()=>{hov=null;});

// ---------- side panel
const leg=$('#legend');
for(let a=1;a<=7;a++){ const c=document.createElement('div'); c.className='chip'; c.dataset.a=a;
  c.innerHTML=`<i style="background:${AREA_COL[a]}"></i>Area ${a}`; c.onclick=()=>{ st.area=st.area===a?null:a; legendUI(); paint(); labels(); list(); }; leg.appendChild(c); }
const all=document.createElement('div'); all.className='chip all'; all.textContent='All'; all.onclick=()=>{st.area=null;legendUI();paint();labels();list();}; leg.appendChild(all);
function legendUI(){ leg.querySelectorAll('.chip[data-a]').forEach(c=>c.classList.toggle('dim',!!st.area&&+c.dataset.a!==st.area)); }

function list(){
  const L=$('#list'); L.innerHTML='';
  const q=st.q.trim().toLowerCase();
  const inView=new Set(groups.flat().map(s=>s.num));
  const secs = q ? SECS.filter(s=>[s.name,s.id,String(s.num),s.vhf,s.callsign,'area '+s.area].some(v=>v.toLowerCase().includes(q)))
                 : SECS.filter(s=>inView.has(s.num));
  for(let a=1;a<=7;a++){
    if(st.area && st.area!==a && !q) continue;
    const ss=secs.filter(s=>s.area===a).sort((x,y)=>x.floor-y.floor||x.num-y.num); if(!ss.length) continue;
    const g=document.createElement('div'); g.className='grp';
    g.innerHTML=`<h3><i style="background:${AREA_COL[a]}"></i>Area ${a}</h3>`;
    ss.forEach(s=>{ const r=document.createElement('div'); r.className='row'+(st.sel===s?' sel':'');
      r.innerHTML=`<b style="color:${AREA_COL[a]}">${tag(s)}</b><span class="n">${s.name}${q?' · '+s.strat:''}</span><span class="f">${s.vhf}</span><span class="alt">${STRAT_NAME[s.strat]} · ${fmtAlt(s)}</span>`;
      r.onclick=()=>select(s,true); g.appendChild(r); });
    L.appendChild(g);
  }
  const nq = q ? (D.neighbors||[]).filter(n=>[n.name,n.fac,n.num,n.id,n.vhf,n.callsign].some(v=>String(v).toLowerCase().includes(q))) : (st.area?[]:nbs);
  [...new Set(nq.map(n=>n.fac))].sort().forEach(f=>{
    const g=document.createElement('div'); g.className='grp'; g.innerHTML=`<h3><i style="background:#71717a"></i>${f} · adjacent</h3>`;
    nq.filter(n=>n.fac===f).sort((a,b)=>a.floor-b.floor||a.num.localeCompare(b.num)).forEach(n=>{ const r=document.createElement('div'); r.className='row'+(st.sel===n?' sel':'');
      r.innerHTML=`<b style="color:#d4d4d8">${nbTag(n)}</b><span class="n">${n.name}</span><span class="f">${n.vhf}</span><span class="alt">${fmtNbAlt(n)}</span>`;
      r.onclick=()=>select(n,true); g.appendChild(r); });
    L.appendChild(g); });
  if(!L.children.length) L.innerHTML='<div style="padding:14px;color:var(--muted)">No sectors.</div>';
}
function select(s,fromList){
  if(s.fac){ if(fromList && !nbs.includes(s)){ const fl=s.floor<240?180:Math.min(s.floor+10,450); st.mode='ALT'; st.fl=fl; $('#tNb').checked=true; render(); } }
  else if(fromList && !groups.flat().includes(s)){ st.mode=s.strat; render(); }
  st.sel=s; detail(); paint(); list();
}
function detail(){
  const d=$('#detail'), s=st.sel; if(!s){ d.className=''; d.innerHTML=''; return; }
  if(s.fac){ d.className='on'; d.innerHTML=`<button class="x" title="Close">×</button><h2 style="color:#d4d4d8">${nbTag(s)}</h2>
    <div class="st">${s.name.toUpperCase()} · ${s.fac} (adjacent ARTCC)</div><table>
    <tr><td>Altitudes</td><td>${fmtNbAlt(s)}</td></tr><tr><td>VHF</td><td class="m">${s.vhf}</td></tr>
    <tr><td>UHF</td><td class="m">${s.uhf||'—'}</td></tr><tr><td>Callsign</td><td class="m">${s.callsign}</td></tr>
    <tr><td>ZID ref</td><td class="m">${s.id}</td></tr><tr><td>Stratum</td><td>${{L:'Low',H:'High',S:'Super High'}[s.strat]||s.strat}</td></tr></table>`;
    d.querySelector('.x').onclick=()=>{st.sel=null;detail();paint();list();}; return; }
  const c=AREA_COL[s.area], under=s.derivedFrom.map(n=>SECS.find(x=>x.num===n)).map(tag).join(' + ');
  const stack=SECS.filter(x=>x.strat!=='LO' && (x.derived?x.derivedFrom:[x.num]).some(n=>(s.derived?s.derivedFrom:[s.num]).includes(n))).sort((a,b)=>a.floor-b.floor);
  d.className='on';
  d.innerHTML=`<button class="x" title="Close">×</button><h2 style="color:${c}">${tag(s)}</h2>
  <div class="st">${s.name.toUpperCase()} ${s.strat} · Area ${s.area}</div>
  <table>
   <tr><td>Altitudes</td><td>${fmtAlt(s)}</td></tr>
   <tr><td>VHF</td><td class="m">${s.vhf}</td></tr>
   <tr><td>UHF</td><td class="m">${s.uhf}</td></tr>
   <tr><td>Callsign</td><td class="m">${s.callsign}</td></tr>
   <tr><td>FPA(s)</td><td class="m">${s.fpa}</td></tr>
   ${s.strat!=='LO'&&stack.length>1?`<tr><td>Stack</td><td>${stack.map(x=>`<span style="${x===s?'color:#fff;font-weight:700':''}">${tag(x)} <span style="color:var(--muted)">${x.ceil>=999?x.floor+'+':x.floor+'–'+x.ceil}</span></span>`).join('<br>')}</td></tr>`:''}
  </table>
  ${s.derived?`<div class="note">Lateral boundary inferred: CRC has no ${s.strat} sector map, so this footprint is drawn as the HI sector(s) beneath it (${under}) per SOP stack relationships.${s.splitNote?' '+s.splitNote:''}</div>`:''}`;
  d.querySelector('.x').onclick=()=>{st.sel=null;detail();paint();list();};
}

// ---------- controls
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{ st.mode=b.dataset.m; render(); });
$('#alt').oninput=e=>{ st.fl=+e.target.value; render(); };
$('#tNb').onchange=()=>{ if(st.sel&&st.sel.fac) st.sel=null; detail(); render(); };
['#tApt','#tTrc','#tLbl'].forEach(i=>$(i).onchange=()=>{ $('#gTrc').style.display=$('#tTrc').checked?'':'none'; labels(); });
$('#search').oninput=e=>{ st.q=e.target.value; list(); };
window.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return;
  const m={'1':'LO','2':'HI','3':'IM','4':'SH','5':'ALT'}[e.key]; if(m){ st.mode=m; render(); }
  if(e.key==='Escape'){ st.sel=null; detail(); paint(); list(); } });
$('#foot').textContent = 'Sources: '+D.source+'. LO/HI boundaries from CRC ERAM Filter 1/11 maps; IM/SH footprints inferred from the HI sectors below them. Adjacent ARTCC sector stubs, SIDs/STARs from CRC NavData (common route + enroute transitions; runway legs omitted); airports from eATS. Not for real-world navigation.';

procUI(); renderProcs(); render(); fit();
})();
</script>
</body>
</html>
